# ============================================
# Hexo 站点配置 —— Reed 的笔记站
# 这个文件平时不用改，改的话只改上面几行就行
# ============================================

# 网站标题（浏览器标签页上显示的）
title: Reed
# 副标题（标题下面那行小字）
subtitle: 'CS 自学 · 算法笔记'
# 描述
description: '记录 CS 自学与算法训练的过程'
# 关键词
keywords: 'CSAPP, CS106L, 算法, C++, 笔记'
# 作者
author: Reed
# 语言：中文
language: zh-CN
# 时区（让文章日期显示正确）
timezone: 'Asia/Shanghai'

# ===== 网站地址 =====
url: https://cherish-lyy.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# ===== 目录 =====
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# ===== 写文章 =====
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: false
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# ===== 首页 =====
index_generator:
  path: ''
  per_page: 10
  order_by: -date

per_page: 10
pagination_dir: page

include:
exclude:
ignore:

# ===== 主题 =====
theme: reed

# ===== 部署（由 GitHub Actions 负责，这里留空）=====
deploy:
  type: ''
